{% extends 'core/portal/base.html' %}{% block content %}
<h1>شهر، گردش و نمودار · {{ device.name }}</h1><form method="post" class="card editor">{% csrf_token %}{{ form.as_p }}<button class="button">ذخیره تنظیمات</button></form>
{% for el in charts %}<form method="post" action="{% url 'panel-chart-preferences' device.pk %}" class="card section-gap">{% csrf_token %}<input type="hidden" name="key" value="{{ el.preference_key }}"><h2>نمودار {{ el.text|default:el.id }}</h2><div class="field-grid"><label>نوع نمودار<select name="chart_type">{% for kind in el.allowed_types %}<option value="{{ kind }}" {% if kind == el.chart_type %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select></label><label>تایم‌فریم (ثانیه)<select name="timeframe">{% for t in el.timeframes %}<option value="{{ t }}" {% if t == el.timeframe %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><label>تعداد نقاط<input name="max_points" type="number" min="2" max="{{ el.point_limit|default:el.max_points }}" value="{{ el.max_points }}"></label><label>رنگ صعود<input name="up_color" type="color" value="{{ el.up_color }}"></label><label>رنگ نزول<input name="down_color" type="color" value="{{ el.down_color }}"></label></div><button class="button">ذخیره نمودار</button></form>{% endfor %}
{% endblock %}
