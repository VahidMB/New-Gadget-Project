{% extends 'core/portal/base.html' %}
{% block title %}{{ heading }} · مدیریت گجت{% endblock %}
{% block content %}<h1>{{ heading }}</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.help_text }}{{ field.errors }}{% endfor %}<div class="actions"><button type="submit">ذخیره</button><a class="button secondary" href="{% url cancel_url %}">انصراف</a></div></form>{% endblock %}
