<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gadget management{% endblock %}</title>
  <style>
    :root { --ink:#172033; --brand:#375dfb; --brand-dark:#2746c8; --muted:#68738a; --line:#e4e8f0; --bg:#f6f8fc; --sidebar:#111a33; --danger:#bd3030; --success:#10785c; } *{box-sizing:border-box} body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.8 system-ui,-apple-system,BlinkMacSystemFont,"Vazirmatn",sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--sidebar);padding:1.5rem 1rem;color:#dce4ff}.brand{display:block;color:#fff!important;font-size:1.15rem;padding:.55rem .8rem;margin-bottom:1.5rem;text-decoration:none}.nav-link{display:block;color:#b9c4e3;text-decoration:none;padding:.63rem .8rem;border-radius:8px;margin:.2rem 0}.nav-link:hover{background:#222e52;color:#fff}.side-bottom{margin-top:1.5rem;border-top:1px solid #303c60;padding:.9rem .8rem}.side-bottom form{padding:0;background:transparent;border:0;box-shadow:none}.content{min-width:0;padding:2.25rem;max-width:1400px;width:100%;margin:auto}h1{font-size:1.65rem;line-height:1.4;margin:0 0 .25rem}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}.button,button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:var(--brand);color:#fff;padding:.56rem .9rem;text-decoration:none;cursor:pointer;font:inherit}.button:hover,button:hover{background:var(--brand-dark)}.button.secondary{background:#e9edfa;color:#263a8c}.button.danger{background:var(--danger)}.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem}.card,form,.table-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.15rem;box-shadow:0 4px 18px #1b2b4408}.number{font-size:2rem;font-weight:750}.muted{color:var(--muted)}.notice{padding:.75rem 1rem;background:#e7f7f1;border:1px solid #bde8d8;color:#086149;border-radius:8px;margin-bottom:1rem}.table-wrap{padding:0;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:.8rem 1rem;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}th{background:#f8faff;color:#53617d;font-size:.85rem}tr:last-child td{border-bottom:0}label{display:block;font-weight:650;margin-top:.9rem}input,textarea,select{width:100%;margin-top:.25rem;padding:.6rem .7rem;border:1px solid #bdc7d9;border-radius:7px;background:#fff;font:inherit}.helptext,.errorlist{color:var(--danger);font-size:.88rem}.errorlist{padding-right:1rem}.status{display:inline-block;padding:.15rem .6rem;border-radius:999px;background:#eef1f7;font-size:.85rem}.empty{padding:2.5rem;text-align:center;color:var(--muted)}.token{direction:ltr;text-align:left;word-break:break-all;background:#111a33;color:#fff;padding:1rem;border-radius:8px}@media(max-width:760px){.layout{display:block}.sidebar{padding:.7rem 1rem}.brand{margin:0}.sidebar nav{display:flex;overflow-x:auto;gap:.3rem}.nav-link{white-space:nowrap}.side-bottom{display:flex;align-items:center;gap:.8rem;margin:0;padding:.4rem .8rem;border:0}.content{padding:1.3rem 1rem}.page-head{display:block}}
  </style>
</head>
<body>
  <div class="layout"><aside class="sidebar"><a class="brand" href="{% url 'panel-dashboard' %}">مدیریت گجت</a><nav><a class="nav-link" href="{% url 'panel-dashboard' %}">داشبورد</a><a class="nav-link" href="{% url 'panel-device-list' %}">دستگاه‌ها</a><a class="nav-link" href="{% url 'panel-message-list' %}">پیام‌ها</a><a class="nav-link" href="{% url 'panel-data-source-list' %}">منابع داده</a>{% if is_platform_owner %}<a class="nav-link" href="{% url 'panel-company-list' %}">شرکت‌ها</a><a class="nav-link" href="{% url 'panel-user-list' %}">کاربران</a><a class="nav-link" href="{% url 'panel-membership-list' %}">عضویت‌ها</a><a class="nav-link" href="{% url 'panel-firmware-list' %}">فریم‌ور</a><a class="nav-link" href="{% url 'admin:index' %}">مدیریت پیشرفتهٔ UI</a>{% endif %}</nav><div class="side-bottom"><span>{{ request.user.get_username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">خروج</button></form></div></aside><main class="content">{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></div>
</body>
</html>
