{% extends 'core/portal/base.html' %}
{% block title %}پیام جدید · مدیریت گجت{% endblock %}
{% block content %}<h1>{{ heading|default:'ساخت پیام جدید' }}</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<div class="actions"><button type="submit">ذخیرهٔ پیام</button><a class="button secondary" href="{% url 'panel-message-list' %}">انصراف</a></div></form>{% endblock %}
