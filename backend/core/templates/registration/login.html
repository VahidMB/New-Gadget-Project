<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in · Gadget Management</title><style>body{background:#f5f7fb;font:16px system-ui,sans-serif}.box{max-width:360px;margin:10vh auto;background:#fff;padding:2rem;border-radius:9px;box-shadow:0 1px 3px #0002}label,input{display:block;width:100%;margin:.4rem 0}input{padding:.55rem;box-sizing:border-box}button{background:#1455b8;color:#fff;border:0;border-radius:5px;padding:.6rem 1rem;margin-top:1rem}</style></head><body><main class="box"><h1>Gadget Management</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<button type="submit">Sign in</button></form></main></body></html>
