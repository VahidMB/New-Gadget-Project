{% load static %}<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ورود · گجت من</title><link rel="stylesheet" href="{% static 'core/console.css' %}"></head><body><main class="setup-shell"><div class="brand"><span class="brand-mark">⬡</span>گجت من</div><section class="card"><h1>خوش آمدی</h1><p class="subtitle">قیمت‌ها و اطلاعات دلخواهت، یک‌جا و مرتب</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field section-gap"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<input type="hidden" name="next" value="{{ next }}"><div class="actions"><button class="button" type="submit">ورود به حساب</button><a href="{% url 'setup' %}">راه‌اندازی اولیه</a></div></form></section></main></body></html>
