server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 10m; # 8 MiB firmware plus multipart form overhead
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /opt/gadget/app/data/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location /api/v1/metrics/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Run `certbot --nginx -d YOUR_DOMAIN` after installing this file. Certbot adds
# the HTTPS server block and redirects this HTTP endpoint to HTTPS.
