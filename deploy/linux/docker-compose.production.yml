services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.production
    volumes:
      - runtime:/app/runtime
      - ../../data/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A gadget_server worker --loglevel=INFO
    restart: unless-stopped
    env_file:
      - ../../.env.production
    volumes:
      - runtime:/app/runtime
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A gadget_server beat --loglevel=INFO
    restart: unless-stopped
    env_file:
      - ../../.env.production
    volumes:
      - runtime:/app/runtime
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto.production.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MQTT_CERTS_DIR}:/mosquitto/certs:ro
      - ${MQTT_PASSWORD_FILE}:/mosquitto/config/passwordfile:ro
      - ./mosquitto.acl:/mosquitto/config/aclfile:ro
      - mosquitto_data:/mosquitto/data

volumes:
  runtime:
  postgres_data:
  redis_data:
  mosquitto_data:
